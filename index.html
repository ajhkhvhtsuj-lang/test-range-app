<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>テスト範囲ノート</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2937;background:#f4f9fc}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:670px;margin:auto;padding:24px 18px 110px}.eyebrow{font-size:13px;color:#788c9a}.head{display:flex;align-items:center;justify-content:space-between}.head h1{margin:4px 0 14px;font-size:27px}.pill{display:inline-block;border-radius:30px;background:#d5f7e8;color:#137b63;padding:8px 13px;font-size:13px;font-weight:700}.hero{margin-top:28px;border-radius:30px;padding:26px 24px;background:linear-gradient(120deg,#08a8ed,#00cbbb);color:white;box-shadow:0 12px 22px #0bb6d02b}.hero small{font-size:15px}.hero-main{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.hero-date{font-size:22px;font-weight:800}.count{font-size:44px;font-weight:800}.count span{font-size:13px}.hero-item{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:9px 0;background:#f3fcff;color:#243544;border-radius:24px;padding:12px 14px;font-size:13px}.hero-item b{color:#008dc1}.section-title{display:flex;justify-content:space-between;align-items:center;margin-top:32px}.section-title h2{font-size:19px;margin:0 0 12px}.link{border:0;background:none;color:#159bd8;font-weight:700}.day{font-weight:800;margin:20px 0 9px}.entry{width:100%;text-align:left;display:block;background:white;border:1px solid #e0eaf0;border-radius:24px;padding:17px;margin-bottom:10px;box-shadow:0 2px 3px #10203008}.entry strong{font-size:17px}.entry p{margin:5px 0 0;color:#71808c;font-size:14px}.circle{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#eaf7ff;color:#0485bc;margin-right:10px;font-weight:800}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #e1e9ee;padding:12px 0 max(14px,env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:#72828d;font-size:12px;min-width:58px}.nav button.active{color:#078cdb;font-weight:800}.nav .plus{background:#e1f4ff;color:#008fe0;border-radius:50%;font-size:27px;width:48px;height:48px}.panel{background:white;border-radius:22px;padding:20px;margin:15px 0;border:1px solid #e1e9ee}.field{display:block;font-size:13px;font-weight:700;margin:15px 0 6px}.control{width:100%;border:1px solid #cddde6;border-radius:12px;padding:12px;background:white;color:#1b2937}.primary{border:0;border-radius:14px;padding:13px 18px;background:#079fdd;color:white;font-weight:800;width:100%;margin-top:18px}.muted{color:#748593;font-size:13px;line-height:1.7}.month{display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:15px}.cell{text-align:center;border-radius:10px;min-height:46px;padding:8px 0;font-size:13px}.cell.has{background:#d9f5f1;color:#006f69;font-weight:800}.cell.today{outline:2px solid #00a6df}.cell.empty{opacity:.1}.chip{display:inline-block;background:#eaf6ff;color:#0786bf;border-radius:14px;padding:3px 8px;font-size:12px}.danger{background:#fff1f1;color:#c43a3a;border:1px solid #f5cece;border-radius:10px;padding:8px 12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.secondary{background:#edf5f8;color:#365264;border:0;border-radius:10px;padding:9px 12px}.empty{color:#7d8b97}.notice{background:#fff9e7;border:1px solid #f4e1a3;border-radius:14px;padding:13px;color:#7b6124;font-size:13px;line-height:1.7}.answer{white-space:pre-wrap;line-height:1.8;background:#eaf8ff;padding:16px;border-radius:14px;margin-top:14px}.hidden{display:none}h2{font-size:20px}
</style>
</head>
<body><main class="wrap"><div id="content"></div></main><nav class="nav"><button data-tab="home" class="active">⌂<br>ホーム</button><button data-tab="calendar">▦<br>カレンダー</button><button data-tab="add" class="plus" aria-label="追加">＋</button><button data-tab="ai">✧<br>AI</button><button data-tab="settings">⚙<br>設定</button></nav>
<script>
(()=>{'use strict';const KEY='test-range-demo-v1';let items=[];try{const stored=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(stored))items=stored.filter(x=>x&&typeof x.subject==='string'&&typeof x.date==='string')}catch(e){}let tab='home',editId=null,monthOffset=0;const root=document.getElementById('content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const sorted=()=>[...items].sort((a,b)=>a.date.localeCompare(b.date)||String(a.period||'').localeCompare(String(b.period||'')));const fmt=d=>{const [y,m,day]=d.split('-').map(Number);return `${m}月${day}日(${['日','月','火','水','木','金','土'][new Date(y,m-1,day).getDay()]})`};const days=d=>Math.ceil((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);const groups=arr=>{const g={};arr.forEach(x=>(g[x.date]??=[]).push(x));return Object.entries(g)};const header=()=>`<div class="eyebrow">テスト範囲ノート</div><div class="head"><h1>こんにちは！</h1><span style="font-size:25px">📚</span></div><span class="pill">✦ 自分のテスト予定</span>`;const cards=arr=>groups(arr).map(([date,list])=>`<div class="day">${fmt(date)} <span class="chip">${days(date)>=0?'あと'+days(date)+'日':'終了'}</span></div>${list.map(x=>`<button class="entry" data-edit="${esc(x.id)}"><span class="circle">${esc(x.subject.slice(0,1))}</span><strong>${esc(x.subject)}</strong> <span class="muted">${esc(x.period||'')}</span><p>${esc(x.scope||'範囲未入力')}</p></button>`).join('')}`).join('');function home(){const upcoming=sorted().filter(x=>days(x.date)>=0),first=upcoming[0],same=first?upcoming.filter(x=>x.date===first.date):[];return header()+`<div class="hero"><small>▣ 次のテスト</small><div class="hero-main"><div><div class="hero-date">${first?fmt(first.date):'まだ予定がありません'}</div><div>${first?same.length+'教科':'＋から登録しよう'}</div></div><div class="count">${first?days(first.date):'–'}<span> ${first?'日':' '}</span></div></div>${same.map(x=>`<div class="hero-item"><b>${esc(x.subject)}</b><span>${esc(x.scope||'範囲未入力')}</span></div>`).join('')}</div><div class="section-title"><h2>直近のテスト</h2><button class="link" data-go="calendar">カレンダーで見る →</button></div>${upcoming.length?cards(upcoming):'<div class="panel muted">テストがまだ登録されていません。下の「＋」から追加できます。</div>'}`};function calendar(){const now=new Date(),d=new Date(now.getFullYear(),now.getMonth()+monthOffset,1),y=d.getFullYear(),m=d.getMonth(),first=d.getDay(),last=new Date(y,m+1,0).getDate(),dates=new Set(items.map(x=>x.date));let cells=['日','月','火','水','木','金','土'].map(x=>`<div class="cell"><b>${x}</b></div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let n=1;n<=last;n++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;cells+=`<div class="cell ${dates.has(date)?'has':''} ${date===today()?'today':''}">${n}${dates.has(date)?'<div>●</div>':''}</div>`}return `<h1>カレンダー</h1><div class="panel"><div class="month"><button class="secondary" data-month="-1">‹</button><strong>${y}年${m+1}月</strong><button class="secondary" data-month="1">›</button></div><div class="calendar">${cells}</div></div><h2>登録済みのテスト</h2>${items.length?cards(sorted()):'<p class="muted">まだ登録されていません。</p>'}`};function add(){const x=items.find(a=>a.id===editId)||{};return `<h1>${editId?'テストを編集':'テストを追加'}</h1><div class="panel"><form id="exam-form"><label class="field" for="subject">教科 *</label><input class="control" id="subject" name="subject" required maxlength="50" value="${esc(x.subject||'')}" placeholder="例：数学"><label class="field" for="date">テスト日 *</label><input class="control" type="date" id="date" name="date" required value="${esc(x.date||today())}"><label class="field" for="period">時限</label><input class="control" id="period" name="period" maxlength="30" value="${esc(x.period||'')}" placeholder="例：1限"><label class="field" for="scope">テスト範囲（単元・ページ）</label><textarea class="control" id="scope" name="scope" rows="4" maxlength="1000" placeholder="例：三角関数、教科書p.20〜45">${esc(x.scope||'')}</textarea><label class="field" for="memo">備考</label><textarea class="control" id="memo" name="memo" rows="2" maxlength="500">${esc(x.memo||'')}</textarea><button class="primary" type="submit">${editId?'変更を保存':'登録する'}</button></form>${editId?`<div class="actions"><button class="danger" id="delete">削除する</button></div>`:''}</div><p class="muted">登録内容はこのブラウザ内だけに保存されます。友達には共有されません。</p>`};function ai(){return `<h1>テストについて質問</h1><div class="notice">これはAIではなく、登録データを検索する簡易デモです。登録していない情報は答えられません。</div><div class="panel"><label class="field" for="question">質問</label><input id="question" class="control" placeholder="例：数学の範囲は？"><button id="ask" class="primary">登録情報から探す</button><div id="answer" aria-live="polite"></div></div>`};function settings(){return `<h1>設定</h1><div class="panel"><h2>データについて</h2><p class="muted">このアプリは無料の試作版です。保存先は現在使っているブラウザのlocalStorageです。端末やブラウザを変えると同期されません。ブラウザのデータを消すと予定も消える可能性があります。</p><button id="export" class="secondary">データをJSONでバックアップ</button></div><div class="panel"><h2>未実装の機能</h2><p class="muted">友達との共有、招待リンク、ログイン、写真の文字読み取り、本物のAIチャットはまだありません。個人情報や秘密の情報は公開リポジトリに書かないでください。</p></div>`};function render(){root.innerHTML=({home,calendar,add,ai,settings}[tab])();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;go('add')});root.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{monthOffset+=Number(b.dataset.month);render()});if(tab==='add'){document.getElementById('exam-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),x={id:editId||String(Date.now()),subject:String(f.get('subject')).trim(),date:String(f.get('date')),period:String(f.get('period')).trim(),scope:String(f.get('scope')).trim(),memo:String(f.get('memo')).trim()};if(!x.subject||!/^\d{4}-\d{2}-\d{2}$/.test(x.date))return alert('教科と日付を確認してください');items=editId?items.map(a=>a.id===editId?x:a):[...items,x];save();editId=null;go('home')};const del=document.getElementById('delete');if(del)del.onclick=()=>{if(confirm('このテストを削除しますか？')){items=items.filter(x=>x.id!==editId);save();editId=null;go('home')}}}if(tab==='ai')document.getElementById('ask').onclick=()=>{const q=document.getElementById('question').value.trim(),out=document.getElementById('answer');if(!q)return;const matched=sorted().filter(x=>q.includes(x.subject)||x.subject.includes(q)||q.includes('次')&&days(x.date)>=0);out.innerHTML=`<div class="answer">${matched.length?matched.slice(0,8).map(x=>`${esc(x.subject)}：${fmt(x.date)} ${esc(x.period)}\n範囲：${esc(x.scope||'未登録')}\n備考：${esc(x.memo||'なし')}`).join('\n\n'):'登録された情報からは見つかりませんでした。'}</div>`};if(tab==='settings')document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='test-range-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('保存できませんでした。ブラウザの設定を確認してください')}}function go(t){tab=t;render();window.scrollTo(0,0)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='add')editId=null;go(b.dataset.tab)});render()})();
</script></body></html>
