<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1b2937;background:#f4f9fc}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:670px;margin:auto;padding:24px 18px 110px}.eyebrow{font-size:13px;color:#788c9a}.head{display:flex;align-items:center;justify-content:space-between}.head h1{margin:4px 0 14px;font-size:27px}.pill{display:inline-block;border-radius:30px;background:#d5f7e8;color:#137b63;padding:8px 13px;font-size:13px;font-weight:700}.hero{margin-top:28px;border-radius:30px;padding:26px 24px;background:linear-gradient(120deg,#08a8ed,#00cbbb);color:white;box-shadow:0 12px 22px #0bb6d02b}.hero small{font-size:15px}.hero-main{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.hero-date{font-size:22px;font-weight:800}.count{font-size:44px;font-weight:800}.count span{font-size:13px}.hero-item{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:9px 0;background:#f3fcff;color:#243544;border-radius:24px;padding:12px 14px;font-size:13px}.hero-item b{color:#008dc1}.section-title{display:flex;justify-content:space-between;align-items:center;margin-top:32px}.section-title h2{font-size:19px;margin:0 0 12px}.link{border:0;background:none;color:#159bd8;font-weight:700}.day{font-weight:800;margin:20px 0 9px}.entry{width:100%;text-align:left;display:block;background:white;border:1px solid #e0eaf0;border-radius:24px;padding:17px;margin-bottom:10px;box-shadow:0 2px 3px #10203008}.entry strong{font-size:17px}.entry p{margin:5px 0 0;color:#71808c;font-size:14px}.circle{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#eaf7ff;color:#0485bc;margin-right:10px;font-weight:800}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #e1e9ee;padding:12px 0 max(14px,env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:#72828d;font-size:12px;min-width:58px}.nav button.active{color:#078cdb;font-weight:800}.nav .plus{background:#e1f4ff;color:#008fe0;border-radius:50%;font-size:27px;width:48px;height:48px}.panel{background:white;border-radius:22px;padding:20px;margin:15px 0;border:1px solid #e1e9ee}.field{display:block;font-size:13px;font-weight:700;margin:15px 0 6px}.control{width:100%;border:1px solid #cddde6;border-radius:12px;padding:12px;background:white;color:#1b2937}.primary{border:0;border-radius:14px;padding:13px 18px;background:#079fdd;color:white;font-weight:800;width:100%;margin-top:18px}.muted{color:#748593;font-size:13px;line-height:1.7}.month{display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:15px}.cell{text-align:center;border-radius:10px;min-height:46px;padding:8px 0;font-size:13px}.cell.has{background:#d9f5f1;color:#006f69;font-weight:800}.cell.today{outline:2px solid #00a6df}.cell.empty{opacity:.1}.chip{display:inline-block;background:#eaf6ff;color:#0786bf;border-radius:14px;padding:3px 8px;font-size:12px}.danger{background:#fff1f1;color:#c43a3a;border:1px solid #f5cece;border-radius:10px;padding:8px 12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.secondary{background:#edf5f8;color:#365264;border:0;border-radius:10px;padding:9px 12px}.empty{color:#7d8b97}.notice{background:#fff9e7;border:1px solid #f4e1a3;border-radius:14px;padding:13px;color:#7b6124;font-size:13px;line-height:1.7}.answer{white-space:pre-wrap;line-height:1.8;background:#eaf8ff;padding:16px;border-radius:14px;margin-top:14px}.hidden{display:none}h2{font-size:20px}

/* 文字のサイズはそのまま */
.nav button:not(.plus) {
  font-size: 12px;
  line-height: 1.3;
}

/* ホーム・カレンダー・AI・設定のマーク */
.nav-icon {
  display: block;
  font-size: 29px;
  line-height: 1.2;
  margin-bottom: 4px;
}
</style>
</head>
<body><main class="wrap"><div id="content"></div></main>
<nav class="nav">
  <button data-tab="home" class="active">
    <span class="nav-icon">⌂</span>ホーム
  </button>
  <button data-tab="calendar">
    <span class="nav-icon">▦</span>カレンダー
  </button>
  <button data-tab="add" class="plus" aria-label="追加">＋</button>
  <button data-tab="ai">
    <span class="nav-icon">✧</span>AI
  </button>
  <button data-tab="settings">
    <span class="nav-icon">⚙</span>設定
  </button>
</nav>
<script>
(()=>{'use strict';const KEY='test-range-demo-v1';let items=[];try{const stored=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(stored))items=stored.filter(x=>x&&typeof x.subject==='string'&&typeof x.date==='string')}catch(e){}let tab='home',editId=null,monthOffset=0;const root=document.getElementById('content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const sorted=()=>[...items].sort((a,b)=>a.date.localeCompare(b.date)||String(a.period||'').localeCompare(String(b.period||'')));const fmt=d=>{const [y,m,day]=d.split('-').map(Number);return `${m}月${day}日(${['日','月','火','水','木','金','土'][new Date(y,m-1,day).getDay()]})`};const days=d=>Math.ceil((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);const groups=arr=>{const g={};arr.forEach(x=>(g[x.date]??=[]).push(x));return Object.entries(g)};const header=()=>`<div class="eyebrow">テスト範囲ノート</div><div class="head"><h1>こんにちは！</h1><span style="font-size:25px">📚</span></div><span class="pill">✦ 自分のテスト予定</span>`;const cards=arr=>groups(arr).map(([date,list])=>`<div class="day">${fmt(date)} <span class="chip">${days(date)>=0?'あと'+days(date)+'日':'終了'}</span></div>${list.map(x=>`<button class="entry" data-edit="${esc(x.id)}"><span class="circle">${esc(x.subject.slice(0,1))}</span><strong>${esc(x.subject)}</strong> <span class="muted">${esc(x.period||'')}</span><p>${esc(x.scope||'範囲未入力')}</p></button>`).join('')}`).join('');function home(){const upcoming=sorted().filter(x=>days(x.date)>=0),first=upcoming[0],same=first?upcoming.filter(x=>x.date===first.date):[];return header()+`<div class="hero"><small>▣ 次のテスト</small><div class="hero-main"><div><div class="hero-date">${first?fmt(first.date):'まだ予定がありません'}</div><div>${first?same.length+'教科':'＋から登録しよう'}</div></div><div class="count">${first?days(first.date):'–'}<span> ${first?'日':' '}</span></div></div>${same.map(x=>`<div class="hero-item"><b>${esc(x.subject)}</b><span>${esc(x.scope||'範囲未入力')}</span></div>`).join('')}</div><div class="section-title"><h2>直近のテスト</h2><button class="link" data-go="calendar">カレンダーで見る →</button></div>${upcoming.length?cards(upcoming):'<div class="panel muted">テストがまだ登録されていません。下の「＋」から追加できます。</div>'}`};function calendar(){const now=new Date(),d=new Date(now.getFullYear(),now.getMonth()+monthOffset,1),y=d.getFullYear(),m=d.getMonth(),first=d.getDay(),last=new Date(y,m+1,0).getDate(),dates=new Set(items.map(x=>x.date));let cells=['日','月','火','水','木','金','土'].map(x=>`<div class="cell"><b>${x}</b></div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let n=1;n<=last;n++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;cells+=`<div class="cell ${dates.has(date)?'has':''} ${date===today()?'today':''}">${n}${dates.has(date)?'<div>●</div>':''}</div>`}return `<h1>カレンダー</h1><div class="panel"><div class="month"><button class="secondary" data-month="-1">‹</button><strong>${y}年${m+1}月</strong><button class="secondary" data-month="1">›</button></div><div class="calendar">${cells}</div></div><h2>登録済みのテスト</h2>${items.length?cards(sorted()):'<p class="muted">まだ登録されていません。</p>'}`};function add(){const x=items.find(a=>a.id===editId)||{};return `<h1>${editId?'テストを編集':'テストを追加'}</h1><div class="panel"><form id="exam-form"><label class="field" for="subject">教科 *</label><input class="control" id="subject" name="subject" required maxlength="50" value="${esc(x.subject||'')}" placeholder="例：数学"><label class="field" for="date">テスト日 *</label><input class="control" type="date" id="date" name="date" required value="${esc(x.date||today())}"><label class="field" for="period">時限</label><input class="control" id="period" name="period" maxlength="30" value="${esc(x.period||'')}" placeholder="例：1限"><label class="field" for="scope">テスト範囲（単元・ページ）</label><textarea class="control" id="scope" name="scope" rows="4" maxlength="1000" placeholder="例：三角関数、教科書p.20〜45">${esc(x.scope||'')}</textarea><label class="field" for="memo">備考</label><textarea class="control" id="memo" name="memo" rows="2" maxlength="500">${esc(x.memo||'')}</textarea><button class="primary" type="submit">${editId?'変更を保存':'登録する'}</button></form>${editId?`<div class="actions"><button class="danger" id="delete">削除する</button></div>`:''}</div><p class="muted">登録内容はこのブラウザ内だけに保存されます。友達には共有されません。</p>`};function ai(){return `<h1>テストについて質問</h1><div class="notice">これはAIではなく、登録データを検索する簡易デモです。登録していない情報は答えられません。</div><div class="panel"><label class="field" for="question">質問</label><input id="question" class="control" placeholder="例：数学の範囲は？"><button id="ask" class="primary">登録情報から探す</button><div id="answer" aria-live="polite"></div></div>`};function settings(){return `<h1>設定</h1><div class="panel"><h2>データについて</h2><p class="muted">このアプリは無料の試作版です。保存先は現在使っているブラウザのlocalStorageです。端末やブラウザを変えると同期されません。ブラウザのデータを消すと予定も消える可能性があります。</p><button id="export" class="secondary">データをJSONでバックアップ</button></div><div class="panel"><h2>未実装の機能</h2><p class="muted">友達との共有、招待リンク、写真の文字読み取り、本物のAIチャットはまだありません。個人情報や秘密の情報は公開リポジトリに書かないでください。</p></div>`};function render(){root.innerHTML=({home,calendar,add,ai,settings}[tab])();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;go('add')});root.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{monthOffset+=Number(b.dataset.month);render()});if(tab==='add'){document.getElementById('exam-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),x={id:editId||String(Date.now()),subject:String(f.get('subject')).trim(),date:String(f.get('date')),period:String(f.get('period')).trim(),scope:String(f.get('scope')).trim(),memo:String(f.get('memo')).trim()};if(!x.subject||!/^\d{4}-\d{2}-\d{2}$/.test(x.date))return alert('教科と日付を確認してください');items=editId?items.map(a=>a.id===editId?x:a):[...items,x];save();editId=null;go('home')};const del=document.getElementById('delete');if(del)del.onclick=()=>{if(confirm('このテストを削除しますか？')){items=items.filter(x=>x.id!==editId);save();editId=null;go('home')}}}if(tab==='ai')document.getElementById('ask').onclick=()=>{const q=document.getElementById('question').value.trim(),out=document.getElementById('answer');if(!q)return;const matched=sorted().filter(x=>q.includes(x.subject)||x.subject.includes(q)||q.includes('次')&&days(x.date)>=0);out.innerHTML=`<div class="answer">${matched.length?matched.slice(0,8).map(x=>`${esc(x.subject)}：${fmt(x.date)} ${esc(x.period)}\n範囲：${esc(x.scope||'未登録')}\n備考：${esc(x.memo||'なし')}`).join('\n\n'):'登録された情報からは見つかりませんでした。'}</div>`};if(tab==='settings')document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='test-range-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('保存できませんでした。ブラウザの設定を確認してください')}}function go(t){tab=t;render();window.scrollTo(0,0)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='add')editId=null;go(b.dataset.tab)});render()})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
(() => {
  const SUPABASE_URL = 'https://ugkywdddyvvnnggexypr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_QlJjT5rd4PsV0-TKJenH_Q_kvtNSl5D';

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const box = document.createElement('div');
  box.id = 'login-box';
  box.className = 'panel';
  box.style.margin = '20px auto';
  box.style.maxWidth = '500px';

  async function showLogin() {
    const { data: { user } } = await client.auth.getUser();

    if (user) {
      box.innerHTML = `
        <h2>ログイン中</h2>
        <p class="muted" id="login-email"></p>
        <button class="primary" id="logout-btn">ログアウト</button>
      `;
      document.getElementById('login-email').textContent = user.email || '';
      document.getElementById('logout-btn').onclick = async () => {
        const { error } = await client.auth.signOut();
        if (error) return alert(error.message);
        showLogin();
      };
    } else {
      box.innerHTML = `
        <h2>ログイン・新規登録</h2>
        <label class="field">メールアドレス</label>
        <input class="control" id="login-email-input" type="email" autocomplete="email">
        <label class="field">パスワード</label>
        <input class="control" id="login-password" type="password" autocomplete="current-password">
        <button class="primary" id="login-btn">ログイン</button>
        <button class="primary" id="signup-btn" style="background:#00b8a9">新規登録</button>
        <p class="muted">新規登録後は、届いたメールの確認リンクを開いてね。</p>
      `;

      const credentials = () => ({
        email: document.getElementById('login-email-input').value.trim(),
        password: document.getElementById('login-password').value
      });

      document.getElementById('login-btn').onclick = async () => {
        const { email, password } = credentials();
        if (!email || !password) return alert('メールアドレスとパスワードを入力してね');
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) return alert(error.message);
        showLogin();
      };

      document.getElementById('signup-btn').onclick = async () => {
        const { email, password } = credentials();
        if (!email || password.length < 8) {
          return alert('メールアドレスと8文字以上のパスワードを入力してね');
        }
        const { error } = await client.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: 'https://ajhkhvhtsuj-lang.github.io/test-range-app/'
          }
        });
        if (error) return alert(error.message);
        alert('確認メールが届いているかチェックしてね！');
      };
    }
  }

  // 自分が作成したグループを表示する（名前は安全にテキストとして挿入）
  async function loadGroups(panel) {
    const list = panel.querySelector('#group-list');
    if (!list) return;
    list.textContent = '読み込み中…';
    try {
      const { data: { user }, error: authError } = await client.auth.getUser();
      if (authError) throw authError;
      if (!user) {
        list.textContent = 'ログインするとグループを確認できます。';
        return;
      }
      const { data, error } = await client.from('study_groups')
        .select('id,name,created_at,created_by')
        .order('created_at', { ascending: false });
      if (error) throw error;
      list.replaceChildren();
      if (!data || data.length === 0) {
        list.textContent = 'まだ参加しているグループはありません。';
        return;
      }
      for (const group of data) {
        const item = document.createElement('div');
        item.style.cssText = 'padding:13px 12px;margin:8px 0;border:1px solid #e0eaf0;border-radius:14px;background:#f5fbff;color:#1b2937;font-weight:700';
        const title = document.createElement('div');
        title.textContent = '👥 ' + group.name;
        item.appendChild(title);
        if (group.created_by === user.id) {
          const inviteButton = document.createElement('button');
          inviteButton.className = 'secondary';
          inviteButton.style.marginTop = '10px';
          inviteButton.textContent = '🔗 招待リンクを作る';
          const inviteOutput = document.createElement('div');
          inviteOutput.className = 'muted';
          inviteButton.onclick = async () => {
            inviteButton.disabled = true;
            inviteOutput.textContent = 'リンクを作成中…';
            try {
              const { data: inviteId, error } = await client.rpc('create_study_group_invite', { p_group_id: group.id });
              if (error) throw error;
              const link = new URL(window.location.href);
              link.searchParams.set('invite', inviteId);
              link.hash = '';
              inviteOutput.textContent = '7日間有効・最大30人まで参加できます。';
              const copyButton = document.createElement('button');
              copyButton.className = 'secondary';
              copyButton.textContent = 'リンクをコピー';
              copyButton.style.marginTop = '8px';
              copyButton.onclick = async () => {
                try { await navigator.clipboard.writeText(link.href); copyButton.textContent = 'コピーできたよ！'; }
                catch (_) { window.prompt('このリンクをコピーしてね', link.href); }
              };
              inviteOutput.appendChild(document.createElement('br'));
              inviteOutput.appendChild(copyButton);
            } catch (e) { inviteOutput.textContent = '作成できませんでした：' + (e.message || '通信エラー'); }
            finally { inviteButton.disabled = false; }
          };
          item.appendChild(inviteButton);
          item.appendChild(inviteOutput);
          const deleteGroupButton = document.createElement('button');
          deleteGroupButton.type = 'button';
          deleteGroupButton.className = 'danger';
          deleteGroupButton.style.margin = '10px 0 0 8px';
          deleteGroupButton.textContent = 'グループを削除';
          deleteGroupButton.onclick = async () => {
            if (!confirm('「' + group.name + '」を削除しますか？\nメンバー全員の共有テストと招待リンクも削除され、元に戻せません。')) return;
            const answer = prompt('本当に削除する場合は「削除」と入力してね');
            if (answer !== '削除') return;
            deleteGroupButton.disabled = true;
            try {
              const { error } = await client.rpc('delete_study_group', { p_group_id: group.id });
              if (error) throw error;
              alert('グループを削除したよ');
              await loadGroups(panel);
              window.dispatchEvent(new Event('shared-groups-changed'));
            } catch (e) {
              alert('削除できませんでした：' + (e.message || '通信エラー'));
              deleteGroupButton.disabled = false;
            }
          };
          item.appendChild(deleteGroupButton);
        }
        list.appendChild(item);
      }
    } catch (error) {
      list.textContent = '一覧を取得できませんでした：' + (error.message || '通信エラー');
    }
  }

  // 設定画面にグループ作成パネルを表示する
  function showGroupPanel() {
    const content = document.getElementById('content');
    if (!content || content.querySelector('h1')?.textContent !== '設定') return;
    if (document.getElementById('group-panel')) return;

    const panel = document.createElement('section');
    panel.id = 'group-panel';
    panel.className = 'panel';
    panel.innerHTML = `
      <h2>友達との共有グループ</h2>
      <h3 style="font-size:16px;margin:18px 0 8px">参加しているグループ</h3>
      <div id="group-list" class="muted" aria-live="polite">読み込み中…</div>
      <p class="muted">グループの作成者は招待リンクを発行・グループを削除できます。削除すると全員の共有テストも消えます。</p>
      <label class="field" for="group-name">グループ名</label>
      <input class="control" id="group-name" maxlength="100" placeholder="例：テスト勉強チーム">
      <button class="primary" id="create-group" type="button">グループを作成</button>
      <p class="muted" id="group-result" role="status" aria-live="polite"></p>
    `;
    content.appendChild(panel);
    loadGroups(panel);

    panel.querySelector('#create-group').addEventListener('click', async () => {
      const name = panel.querySelector('#group-name').value.trim();
      const result = panel.querySelector('#group-result');
      const button = panel.querySelector('#create-group');
      if (!name) { result.textContent = 'グループ名を入力してね。'; return; }
      button.disabled = true;
      result.textContent = '作成中…';
      try {
        const { data: { user }, error: authError } = await client.auth.getUser();
        if (authError || !user) throw new Error('先にログインしてね。');
        const { error } = await client.rpc('create_study_group', { group_name: name });
        if (error) throw error;
        result.textContent = 'グループを作成できたよ！';
        panel.querySelector('#group-name').value = '';
        await loadGroups(panel);
      } catch (error) {
        result.textContent = '作成できませんでした：' + (error.message || '通信エラー');
      } finally {

<script>
// 個人予定と参加グループの予定をホーム・AIに統合
(() => {
  const client=window.supabase.createClient('https://ugkywdddyvvnnggexypr.supabase.co','sb_publishable_QlJjT5rd4PsV0-TKJenH_Q_kvtNSl5D');

  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const fmt=v=>{const [y,m,d]=v.split('-').map(Number);return `${m}月${d}日(${['日','月','火','水','木','金','土'][new Date(y,m-1,d).getDay()]})`};
  const days=v=>Math.round((new Date(v+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
  const personal=()=>{try{return (JSON.parse(localStorage.getItem('test-range-demo-v1')||'[]')||[]).filter(x=>x&&x.date&&x.subject).map(x=>({id:x.id,date:x.date,subject:x.subject,range:x.scope||'',period:x.period||'',memo:x.memo||'',shared:false}));}catch{return []}};
  let shared=[],error='',loaded=false,seq=0;
  async function fetchShared(){
    const n=++seq;let result=[],failure='';
    try {
      const {data:{user},error:authError}=await client.auth.getUser();
      if(authError)throw authError;
      if(user){
        const {data:groups,error:groupError}=await client.from('study_groups').select('id,name');
        if(groupError)throw groupError;
        if(groups?.length){
          const {data:exams,error:examError}=await client.from('exams').select('id,group_id,subject,exam_date,exam_range').in('group_id',groups.map(g=>g.id)).order('exam_date',{ascending:true});
          if(examError)throw examError;
          result=(exams||[]).map(x=>({id:x.id,date:x.exam_date,subject:x.subject,range:x.exam_range||'',period:'',memo:'',shared:true,group_id:x.group_id,group:groups.find(g=>g.id===x.group_id)?.name||'グループ'}));
        }
      }
    }catch(e){failure=e.message||'通信エラー'}
    if(n!==seq)return;
    shared=result;error=failure;loaded=true;drawHome();
  }
  function combined(){
    const all=personal();
    for(const x of shared){
      const duplicate=all.find(p=>!p.shared&&p.date===x.date&&p.subject===x.subject&&p.range===x.range);
      if(duplicate){duplicate.shared=true;duplicate.group=x.group;duplicate.group_id=x.group_id;duplicate.sharedId=x.id;}
      else all.push(x);

    return all.sort((a,b)=>a.date.localeCompare(b.date)||a.subject.localeCompare(b.subject,'ja'));
  }

    const upcoming=combined().filter(x=>x.date>=today());

    if(!loaded)html+='<p class="muted">共有テストを読み込み中…</p>';

      if(x.date!==last){last=x.date;html+=`<div class="day">${fmt(x.date)} <span class="chip">あと${days(x.date)}日</span></div>`;}
      html+=`<${x.shared?'div':'button'} class="entry" ${x.shared?'style="cursor:default"':`data-edit="${esc(x.id)}"`}><span class="circle">${esc(x.subject.slice(0,1))}</span><strong>${esc(x.subject)}</strong>${x.shared?' <span class="chip">👥 共有</span> <button type="button" class="secondary shared-edit-btn" data-shared-id="${esc(x.sharedId||x.id)}" data-group-id="${esc(x.group_id)}">編集</button>':''}<span class="muted"> ${esc(x.period)}</span><p style="white-space:pre-wrap">${esc(x.range||'範囲未入力')}</p></${x.shared?'div':'button'}>`;
    }
    if(!upcoming.length)html+='<div class="panel muted">これからのテストはまだありません。</div>';
    area.innerHTML=html;
    area.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const original=[...root.querySelectorAll('[data-edit]')].find(x=>x!==b&&x.dataset.edit===b.dataset.edit);if(original)original.click();else {const raw=personal().find(x=>x.id===b.dataset.edit);if(raw){document.querySelector('[data-tab="calendar"]').click();root.querySelector(`[data-edit="${CSS.escape(String(raw.id))}"]`)?.click();}}});
  }
  // AIのデモ検索を共有予定にも対応させる

    out.innerHTML=`<div class="answer">${matches.length?matches.slice(0,12).map(x=>`${esc(x.subject)}：${esc(fmt(x.date))}${x.shared?' 👥共有':''}\n範囲：${esc(x.range||'未登録')}\n備考：${esc(x.memo||'なし')}`).join('\n\n'):'登録された情報からは見つかりませんでした。'}</div>`;
  },true);
  const observer=new MutationObserver(()=>{if(root.querySelector('.hero')&&!root.querySelector('#merged-test-list'))drawHome();});
  observer.observe(root,{childList:true});
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTimeout(()=>{if(b.dataset.tab==='home')drawHome();if(b.dataset.tab==='home'||b.dataset.tab==='ai')fetchShared();},0)));
  client.auth.onAuthStateChange(()=>setTimeout(fetchShared,0));
  window.addEventListener('shared-groups-changed',fetchShared);
  window.addEventListener('focus',fetchShared);
  fetchShared();drawHome();
})();
</script>

        }
      }
    }catch(e){failure=e.message||'通信エラー'}
    if(n!==seq)return;cache=data;error=failure;loaded=true;draw();
  }
  function draw(){
    if(!isCalendar())return;
    let area=root.querySelector('#calendar-shared-exams');
    if(!area){area=document.createElement('section');area.id='calendar-shared-exams';root.appendChild(area)}
    let html='<h2>👥 グループのテスト</h2>';
    if(!loaded)html+='<p class="muted">読み込み中…</p>';
    else if(error)html+=`<p class="muted">読み込めませんでした：${esc(error)}</p>`;
    else if(!cache.length)html+='<p class="muted">共有テストはまだありません。</p>';
    let last='';
    for(const x of cache){
      if(x.exam_date!==last){last=x.exam_date;html+=`<div class="day">${fmt(x.exam_date)}</div>`}
      html+=`<div class="entry" style="cursor:default"><span class="circle">${esc(x.subject.slice(0,1))}</span><strong>${esc(x.subject)}</strong> <span class="chip">👥 ${esc(x.group_name)}</span> <button type="button" class="secondary shared-edit-btn" data-shared-id="${esc(x.id)}" data-group-id="${esc(x.group_id)}">編集</button><p style="white-space:pre-wrap">${esc(x.exam_range||'範囲未入力')}</p></div>`;
    }
    area.innerHTML=html;
    // カレンダーの該当日にも印を付ける（元の月移動処理を維持）
    const monthTitle=root.querySelector('.month strong')?.textContent||'';
    const m=monthTitle.match(/(\d+)年(\d+)月/);
    if(m){
      const yy=Number(m[1]),mm=Number(m[2]);
      const days=new Set(cache.filter(x=>{const d=x.exam_date.split('-').map(Number);return d[0]===yy&&d[1]===mm}).map(x=>Number(x.exam_date.slice(-2))));
      for(const cell of root.querySelectorAll('.calendar .cell')){
        if(cell.querySelector('b')||cell.classList.contains('empty'))continue;
        const day=Number(cell.textContent.match(/^\d+/)?.[0]);
        if(days.has(day)){
          cell.classList.add('has');
          if(!cell.querySelector('.shared-calendar-dot')){
            const dot=document.createElement('div');dot.className='shared-calendar-dot';dot.textContent='👥';dot.style.fontSize='11px';cell.appendChild(dot);
          }
        }
      }
    }
  }
  const observer=new MutationObserver(()=>{if(isCalendar()&&!root.querySelector('#calendar-shared-exams'))draw()});
  observer.observe(root,{childList:true});
  document.querySelector('[data-tab="calendar"]').addEventListener('click',()=>setTimeout(()=>{draw();load()},0));
  document.querySelector('[data-tab="home"]').addEventListener('click',()=>++seq);
  client.auth.onAuthStateChange(()=>setTimeout(load,0));
  window.addEventListener('focus',()=>{if(isCalendar())load()});
  window.addEventListener('shared-groups-changed',load);
  load();
})();
</script>

<script>
// ホーム・カレンダーの共有テストを直接編集する
(() => {
  const client=window.supabase.createClient('https://ugkywdddyvvnnggexypr.supabase.co','sb_publishable_QlJjT5rd4PsV0-TKJenH_Q_kvtNSl5D');
  document.getElementById('content').addEventListener('click',async e=>{
    const btn=e.target.closest('.shared-edit-btn');if(!btn)return;
    e.preventDefault();e.stopPropagation();
    btn.disabled=true;
    try{
      const {data:exam,error:readError}=await client.from('exams').select('id,group_id,subject,exam_date,exam_range').eq('id',btn.dataset.sharedId).eq('group_id',btn.dataset.groupId).single();
      if(readError)throw readError;
      const subject=prompt('教科を編集',exam.subject);if(subject===null)return;
      if(!subject.trim()||subject.trim().length>50)return alert('教科は1〜50文字で入力してね');
      const date=prompt('テスト日（YYYY-MM-DD）',exam.exam_date);if(date===null)return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date)))return alert('日付を確認してね');
      const range=prompt('テスト範囲を編集',exam.exam_range||'');if(range===null)return;
      if(range.length>1000)return alert('テスト範囲は1000文字以内にしてね');
      const {error}=await client.from('exams').update({subject:subject.trim(),exam_date:date,exam_range:range}).eq('id',exam.id).eq('group_id',exam.group_id);
      if(error)throw error;
      alert('共有テストを更新したよ！');
      window.dispatchEvent(new Event('shared-groups-changed'));
      document.querySelector('[data-tab="'+(document.querySelector('[data-tab="calendar"].active')?'calendar':'home')+'"]').click();
    }catch(err){alert('編集できませんでした：'+(err.message||'通信エラー'))}
    finally{btn.disabled=false}
  });
})();
</script>
<script>
// テストをタップすると、その場で編集フォームを開く
(() => {
 const root=document.getElementById('content');
 const client=window.supabase.createClient('https://ugkywdddyvvnnggexypr.supabase.co','sb_publishable_QlJjT5rd4PsV0-TKJenH_Q_kvtNSl5D');
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const key='test-range-demo-v1';
 const personal=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')||[]}catch{return []}};
 const style=document.createElement('style');style.textContent='.inline-edit{margin-top:14px;padding:15px;background:#f0faff;border:1px solid #c7e7f5;border-radius:16px;text-align:left}.inline-edit .field{margin-top:9px}.inline-edit-actions{display:flex;gap:8px;align-items:center;margin-top:12px}.inline-edit-actions .primary{margin-top:0;flex:1}.entry[data-edit],.entry:has(.shared-edit-btn){cursor:pointer!important}';document.head.appendChild(style);
 root.addEventListener('click',async e=>{
   if(e.target.closest('.inline-edit'))return;
   const entry=e.target.closest('.entry');if(!entry||!root.contains(entry))return;
   const sharedBtn=entry.querySelector('.shared-edit-btn');
   const ownId=entry.dataset.edit;
   if(!sharedBtn&&!ownId)return;
   e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
   if(entry.querySelector('.inline-edit')){entry.querySelector('.inline-edit').remove();return}
   root.querySelectorAll('.inline-edit').forEach(x=>x.remove());
   let exam,shared=!!sharedBtn;
   if(shared){
     const {data,error}=await client.from('exams').select('id,group_id,subject,exam_date,exam_range').eq('id',sharedBtn.dataset.sharedId).eq('group_id',sharedBtn.dataset.groupId).single();
     if(error){alert('読み込めませんでした：'+error.message);return}exam={id:data.id,group_id:data.group_id,subject:data.subject,date:data.exam_date,range:data.exam_range||''};
   }else{
     const x=personal().find(x=>String(x.id)===String(ownId));if(!x)return;
     exam={id:x.id,subject:x.subject,date:x.date,range:x.scope||'',period:x.period||'',memo:x.memo||''};
   }
   const wrapper=document.createElement('div');wrapper.className='inline-edit';
   wrapper.innerHTML=`<form><strong>✏️ テスト内容を編集</strong><label class="field">教科</label><input class="control" name="subject" maxlength="50" required value="${esc(exam.subject)}"><label class="field">テスト日</label><input class="control" name="date" type="date" required value="${esc(exam.date)}"><label class="field">テスト範囲</label><textarea class="control" name="range" rows="4" maxlength="1000">${esc(exam.range)}</textarea>${shared?'':`<label class="field">時限</label><input class="control" name="period" maxlength="30" value="${esc(exam.period)}"><label class="field">備考</label><textarea class="control" name="memo" rows="2" maxlength="500">${esc(exam.memo)}</textarea>`}<div class="inline-edit-actions"><button class="primary" type="submit">保存する</button><button type="button" class="secondary cancel-edit">閉じる</button></div><p class="muted edit-status" role="status"></p></form>`;
   // button.entry の中に form を入れないように、button の直後に置く
   entry.after(wrapper);
   wrapper.querySelector('.cancel-edit').onclick=()=>wrapper.remove();
   wrapper.querySelector('form').onsubmit=async ev=>{
     ev.preventDefault();const f=new FormData(ev.currentTarget);
     const subject=String(f.get('subject')||'').trim(),date=String(f.get('date')||''),range=String(f.get('range')||'');
     if(!subject||!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date)))return alert('教科と日付を確認してね');
     const save=wrapper.querySelector('[type=submit]');save.disabled=true;wrapper.querySelector('.edit-status').textContent='保存中…';
     try{
       if(shared){const {error}=await client.from('exams').update({subject,exam_date:date,exam_range:range}).eq('id',exam.id).eq('group_id',exam.group_id);if(error)throw error;window.dispatchEvent(new Event('shared-groups-changed'));}
       else{const all=personal();const i=all.findIndex(x=>String(x.id)===String(exam.id));if(i<0)throw new Error('予定が見つかりません');all[i]={...all[i],subject,date,scope:range,period:String(f.get('period')||''),memo:String(f.get('memo')||'')};localStorage.setItem(key,JSON.stringify(all));}
       wrapper.querySelector('.edit-status').textContent='保存できたよ！';
       // 個人データを含め、既存アプリの表示を再描画
       setTimeout(()=>location.reload(),350);
     }catch(err){wrapper.querySelector('.edit-status').textContent='保存できませんでした：'+(err.message||'通信エラー');save.disabled=false;}
   };
 },true);
})();
</script>
